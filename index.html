<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinica Pazin — Portal de Treinamento & Operações</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦷</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sidebar-bg: #0b1120;
      --sidebar-hover: #1e293b;
      --sidebar-border: #1e293b;
      --primary: #2563eb;
      --primary-glow: #3b82f6;
      --cyan: #06b6d4;
      --bg-main: #f1f5f9;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --border-light: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    
    body { 
      display: flex; 
      height: 100vh; 
      background-color: var(--bg-main);
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-dark); 
      overflow: hidden; 
    }

    /* Scrollbar estilizada */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

    /* ==========================================
       BARRA LATERAL (DARK TECH)
       ========================================== */
    .sidebar { 
      width: 340px; 
      background: linear-gradient(180deg, #0b1120 0%, #0f172a 100%);
      border-right: 1px solid rgba(255,255,255,0.08); 
      display: flex; 
      flex-direction: column; 
      height: 100%; 
      color: #f8fafc;
      box-shadow: 4px 0 24px rgba(0,0,0,0.15);
      z-index: 10;
    }

    .sidebar-header { 
      padding: 24px 20px; 
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.01);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--cyan) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.4);
    }

    .brand-text h1 { 
      font-size: 1.15rem; 
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text span {
      font-size: 0.72rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      display: block;
      margin-top: 2px;
    }

    .search-wrapper { position: relative; }

    .search-box { 
      width: 100%; 
      padding: 11px 14px 11px 38px; 
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2); 
      border-radius: 10px; 
      font-size: 0.88rem; 
      color: #fff;
      outline: none; 
      transition: all 0.25s ease;
    }

    .search-box::placeholder { color: #64748b; }
    .search-box:focus { 
      border-color: var(--cyan); 
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
      background: #0f172a;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.6;
    }

    .nav-list { flex: 1; overflow-y: auto; padding: 16px; }
    
    .category-title { 
      font-size: 0.7rem; 
      text-transform: uppercase; 
      letter-spacing: 0.08em; 
      color: #38bdf8; 
      margin: 20px 0 8px 8px; 
      font-weight: 800; 
      opacity: 0.9;
    }

    .nav-item { 
      padding: 10px 14px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 0.88rem; 
      margin-bottom: 4px; 
      transition: all 0.2s ease; 
      color: #cbd5e1;
      border-left: 3px solid transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-item:hover { 
      background: rgba(255, 255, 255, 0.05); 
      color: #ffffff;
      transform: translateX(3px);
    }

    .nav-item.active { 
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.25) 0%, rgba(6, 182, 212, 0.05) 100%);
      color: #ffffff; 
      font-weight: 600; 
      border-left: 3px solid var(--cyan);
      box-shadow: inset 0 0 12px rgba(6, 182, 212, 0.1);
    }

    /* ==========================================
       ÁREA DE CONTEÚDO PRINCIPAL
       ========================================== */
    .main-content { 
      flex: 1; 
      overflow-y: auto; 
      padding: 36px 48px; 
    }

    .tutorial-container { 
      max-width: 1040px; 
      margin: 0 auto; 
      background: var(--card-bg); 
      border-radius: 18px; 
      box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.03); 
      border: 1px solid rgba(226, 232, 240, 0.9);
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero Banner do Tutorial */
    .tutorial-hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #0284c7 100%);
      padding: 32px 40px;
      color: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .tutorial-hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(56,189,248,0.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .badge { 
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px; 
      background: rgba(56, 189, 248, 0.18); 
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc; 
      border-radius: 99px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px; 
    }

    .tutorial-title { 
      font-size: 1.7rem; 
      font-weight: 800;
      color: #ffffff; 
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .tutorial-body { padding: 36px 40px; }

    /* Player de Vídeo Tech */
    .video-container { 
      margin: 0 0 30px 0; 
      position: relative; 
      padding-bottom: 52%; 
      height: 0; 
      overflow: hidden; 
      border-radius: 14px; 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25);
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }

    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    
    .video-placeholder { 
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #94a3b8; 
      font-size: 0.95rem; 
      text-align: center; 
      padding: 24px; 
      width: 90%;
    }

    .play-icon-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin: 0 auto 12px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    /* Textos e Listas */
    .steps-content { line-height: 1.7; font-size: 0.98rem; color: var(--text-body); }
    
    .steps-content h3 { 
      margin: 30px 0 14px; 
      color: var(--text-dark); 
      font-size: 1.15rem; 
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .steps-content h3::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 20px;
      background: linear-gradient(180deg, var(--primary) 0%, var(--cyan) 100%);
      border-radius: 4px;
    }

    .steps-content h3:first-child { margin-top: 0; }

    /* Lista numerada estilizada */
    .steps-content ol { 
      list-style: none; 
      counter-reset: step-counter; 
      margin-bottom: 20px; 
    }

    .steps-content ol li { 
      counter-increment: step-counter;
      position: relative;
      padding: 12px 16px 12px 50px;
      background: #f8fafc;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }

    .steps-content ol li:hover {
      border-color: #bae6fd;
      background: #f0f9ff;
    }

    .steps-content ol li::before {
      content: counter(step-counter);
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--cyan) 100%);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    .steps-content ul { margin-left: 20px; margin-bottom: 20px; }
    .steps-content ul li { margin-bottom: 8px; }

    /* ==========================================
       PAINÉIS DE CÂMERA (POR MODO) & FOTOS MODELO
       ========================================== */
    .cam-preset-box {
      background: #f8fafc;
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0 24px;
    }

    .cam-preset-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cam-preset-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cam-preset-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      background: #dbeafe;
      color: #1e40af;
    }

    .camera-dial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
    }

    .camera-btn-card {
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 16px 14px;
      text-align: center;
      color: #fff;
      box-shadow: 0 6px 16px -4px rgba(15, 23, 42, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .camera-btn-card:hover {
      transform: translateY(-3px);
      border-color: var(--cyan);
      box-shadow: 0 10px 22px -4px rgba(6, 182, 212, 0.25);
    }

    .camera-btn-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
    }

    .camera-btn-value {
      display: inline-block;
      font-size: 1.35rem;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 5px 16px;
      border-radius: 10px;
      margin-bottom: 6px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .camera-btn-sub {
      font-size: 0.78rem;
      color: #cbd5e1;
      display: block;
      line-height: 1.3;
    }

    /* Galeria de Fotos Modelo */
    .photo-section-subtitle {
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .photo-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin: 12px 0 26px;
    }

    .photo-slot-card {
      background: #f8fafc;
      border: 2px dashed #93c5fd;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }

    .photo-slot-card:hover {
      border-color: var(--primary);
      background: #f0f9ff;
      transform: translateY(-2px);
    }

    .photo-preview-box {
      height: 155px;
      background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      color: #1e40af;
      position: relative;
    }

    .photo-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    .photo-preview-icon {
      font-size: 1.7rem;
      margin-bottom: 4px;
    }

    .photo-preview-hint {
      font-size: 0.7rem;
      color: #2563eb;
      background: rgba(255, 255, 255, 0.9);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      margin-top: 5px;
    }

    .photo-slot-caption {
      padding: 10px 12px;
      background: #ffffff;
      border-top: 1px solid var(--border-light);
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .photo-slot-caption span {
      display: block;
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Caixas de Alerta Tech */
    .alert-box { 
      background: linear-gradient(90deg, #fffbeb 0%, #fef3c7 100%); 
      border-left: 4px solid #f59e0b; 
      padding: 14px 18px; 
      border-radius: 10px; 
      margin: 20px 0; 
      font-size: 0.94rem; 
      color: #92400e;
    }

    .info-box { 
      background: linear-gradient(90deg, #eff6ff 0%, #e0f2fe 100%); 
      border-left: 4px solid var(--primary); 
      padding: 16px 20px; 
      border-radius: 10px; 
      margin: 0 0 24px 0; 
      font-size: 0.95rem; 
      color: #1e3a8a;
    }

    /* Tabelas Modernas */
    .table-responsive { 
      overflow-x: auto; 
      margin: 16px 0 28px; 
      border-radius: 12px;
      border: 1px solid var(--border-light);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: left; }
    
    th { 
      background: #0f172a; 
      color: #f8fafc; 
      font-weight: 700; 
      text-transform: uppercase;
      font-size: 0.74rem;
      letter-spacing: 0.05em;
      padding: 13px 15px;
      border-bottom: 2px solid var(--cyan);
    }

    td { 
      border-bottom: 1px solid var(--border-light); 
      padding: 13px 15px; 
      vertical-align: middle; 
      color: var(--text-body);
    }

    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: #f8fafc; }
    tr:hover td { background-color: #f0f9ff; }

    /* Pílulas e Destaques */
    .room-pill {
      display: inline-block;
      padding: 3px 9px;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.8rem;
      margin: 2px 0;
    }

    .conv-tag {
      display: inline-block;
      padding: 3px 9px;
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      margin: 2px 3px 2px 0;
    }

    .highlight-red { 
      display: inline-block;
      background: #fee2e2;
      color: #dc2626; 
      font-weight: 800; 
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    /* Botões de Links Rápidos */
    .quick-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 0 0 26px 0;
    }

    .quick-link-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    }

    .quick-link-btn:hover {
      transform: translateY(-2px);
      border-color: var(--cyan);
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.25);
      color: #38bdf8;
    }

    .quick-link-icon {
      font-size: 1.3rem;
      background: rgba(56, 189, 248, 0.15);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Menu Lateral Dark Tech -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">🦷</div>
        <div class="brand-text">
          <h1>Clínica Pazin</h1>
          <span>Academy & Operações</span>
        </div>
      </div>
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar tutorial, doutor, sala...">
      </div>
    </div>
    <div class="nav-list" id="navList"></div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <div class="tutorial-container" id="tutorialDisplay"></div>
  </main>

  <script>
    // =========================================================================

                <tr>
                  <td><strong>Dra. Alessandra</strong></td>

    const navList = document.getElementById('navList');
    const tutorialDisplay = document.getElementById('tutorialDisplay');
    const searchInput = document.getElementById('searchInput');
    let activeId = tutoriais[0].id;

    function renderMenu(filtro = "") {
      navList.innerHTML = "";
      const categorias = [...new Set(tutoriais.map(t => t.categoria))];

      categorias.forEach(cat => {
        const itensFiltrados = tutoriais.filter(t => 
          t.categoria === cat && 
          (t.titulo.toLowerCase().includes(filtro.toLowerCase()) || t.conteudo.toLowerCase().includes(filtro.toLowerCase()))
        );

        if (itensFiltrados.length > 0) {
          const catTitle = document.createElement('div');
          catTitle.className = 'category-title';
          catTitle.textContent = cat;
          navList.appendChild(catTitle);

          itensFiltrados.forEach(item => {
            const navItem = document.createElement('div');
            navItem.className = `nav-item ${item.id === activeId ? 'active' : ''}`;
            navItem.innerHTML = `<span>${item.titulo}</span>`;
            navItem.onclick = () => selecionarTutorial(item.id);
            navList.appendChild(navItem);
          });
        }
      });
    }

    function selecionarTutorial(id) {
      activeId = id;
      const tut = tutoriais.find(t => t.id === id);
      renderMenu(searchInput.value);

      let videoHtml = "";
      if (!tut.semVideo) {
        if (tut.videoUrl) {
          videoHtml = `<div class="video-container"><iframe src="${tut.videoUrl}" allowfullscreen></iframe></div>`;
        } else {
          videoHtml = `
            <div class="video-container">
              <div class="video-placeholder">
                <div class="play-icon-circle">▶</div>
                <strong>Vídeo Tutorial em Breve</strong><br>
                <span>Adicione o link da gravação no código para exibir o player aqui</span>
              </div>
            </div>`;
        }
      }

      tutorialDisplay.innerHTML = `
        <div class="tutorial-hero">
          <span class="badge">${tut.categoria}</span>
          <h2 class="tutorial-title">${tut.titulo}</h2>
        </div>
        <div class="tutorial-body">
          ${videoHtml}
          <div class="steps-content">${tut.conteudo}</div>
        </div>
      `;
    }

    searchInput.addEventListener('input', (e) => renderMenu(e.target.value));

    // Inicializa o sistema
    renderMenu();
    selecionarTutorial(activeId);
  </script>
